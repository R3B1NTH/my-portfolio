<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact | BerylBytes</title><link rel="stylesheet" href="editorial.css"><link rel="stylesheet" href="visual-refresh.css"><style>.form-wrap{max-width:700px;padding:55px 0 90px}.contact-form label{display:block;margin:20px 0}.contact-form label span{display:block;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.12em;margin-bottom:7px}.contact-form input:not([type=hidden]),.contact-form textarea{display:block;width:100%;padding:13px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink);font:inherit}.contact-form button{border:0;cursor:pointer}.form-note{color:var(--muted);font-size:12px}</style></head><body><header class="header"><div class="wrap header-inner"><a class="brand" href="index.html"><img src="images/logo.png" alt="BerylBytes logo"><span>BERYL<em>BYTES</em></span></a><a class="link-arrow" style="margin-left:auto" href="index.html#contact">Back to BerylBytes ↗</a></div></header><main class="wrap form-wrap"><div class="eyebrow">CONTACT</div><h1 class="section-title">Let’s talk about it.</h1><form
          class="contact-form"
          action="https://formspree.io/f/xrpzyzkk"
          method="POST"
        >

          <input
            type="hidden"
            name="_subject"
            value="New BerylBytes portfolio enquiry"
          />


          <label>

            <span>YOUR NAME</span>

            <input
              type="text"
              name="name"
              placeholder="Jane Doe"
              required
            />

          </label>


          <label>

            <span>EMAIL ADDRESS</span>

            <input
              type="email"
              name="email"
              placeholder="jane@example.com"
              required
            />

          </label>


          <label>

            <span>WHAT ARE YOU WORKING ON?</span>

            <input
              type="text"
              name="project"
              placeholder="Website, brand, content, collaboration..."
              required
            />

          </label>


          <label>

            <span>MESSAGE</span>

            <textarea
              name="message"
              rows="6"
              placeholder="Tell me a little about the project..."
              required
            ></textarea>

          </label>


          <button
            type="submit"
            class="btn btn-primary submit-btn"
          >
            Send message
            <b>↗</b>
          </button>


          <p class="form-note">
            Your message is securely sent through Formspree.
            I'll receive the enquiry by email.
          </p>

        </form></main></body></html>
